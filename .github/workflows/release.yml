name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PROJECT_PATH: src/AntiAfk.App/AntiAfk.App.csproj

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging AntiAFK v$VERSION"

      - name: Set version in csproj
        shell: pwsh
        run: |
          $csproj = "${{ env.PROJECT_PATH }}"
          $version = "${{ steps.version.outputs.version }}"
          $content = Get-Content $csproj -Raw
          if ($content -match '<Version>.*?</Version>') {
            $content = $content -replace '<Version>.*?</Version>', "<Version>$version</Version>"
          } else {
            $content = $content -replace '(<PropertyGroup>)', "`$1`r`n    <Version>$version</Version>"
          }
          Set-Content $csproj $content -NoNewline

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate app icon
        run: dotnet run --project tools/GenerateAppIcon/GenerateAppIcon.csproj -- src/AntiAfk.App/Assets/app.ico

      - name: Publish self-contained single-file exe
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 -o publish

      - name: Verify release artifact is self-contained
        shell: pwsh
        run: |
          # The release ships AntiAFK.exe on its own and the updater swaps that single file over a
          # running install. If publish ever emits loose runtime files again, the uploaded exe would
          # not run - fail the build here instead of shipping a broken release.
          $files = Get-ChildItem publish -File
          $exe = $files | Where-Object Name -eq 'AntiAFK.exe'
          if (-not $exe) { throw "AntiAFK.exe missing from publish output" }

          $stray = $files | Where-Object { $_.Name -ne 'AntiAFK.exe' }
          if ($stray) {
            $list = ($stray | ForEach-Object Name) -join ', '
            throw "Publish emitted $($stray.Count) extra file(s) beside AntiAFK.exe: $list"
          }

          if ($exe.Length -lt 20MB) {
            throw "AntiAFK.exe is only $([math]::Round($exe.Length/1MB,1)) MB - runtime is not bundled"
          }

          Write-Host "OK: single self-contained artifact, $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path "publish/AntiAFK.exe" -Algorithm SHA256
          "$($hash.Hash.ToLower())  AntiAFK.exe" | Set-Content -Path "publish/AntiAFK.exe.sha256" -NoNewline

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            "publish/AntiAFK.exe" \
            "publish/AntiAFK.exe.sha256" \
            --title "AntiAFK v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Release summary
        shell: bash
        run: |
          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset: \`AntiAFK.exe\` (portable, no installer)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open release on GitHub](https://github.com/${{ github.repository }}/releases)" >> "$GITHUB_STEP_SUMMARY"
